# Builds the website and publishes it to GitHub Pages.
# Runs automatically on every push to `main` (code changes AND CMS saves), or by hand from the Actions tab.
# If the product data or the code is invalid, the "check" step fails and the live site is left untouched.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer save waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Prepare content (validates every cake, copies CMS files)
        run: npm run prepare:content

      - name: Check (type-check + tests)
        run: npm run check

      - name: Build the static site
        run: npm run build
        env:
          # Optional: add a repository variable named SITE_URL to override.
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://passionbakerynchocos.co.in' }}

      - name: Disable Jekyll (so the _next folder is served)
        run: touch out/.nojekyll

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
